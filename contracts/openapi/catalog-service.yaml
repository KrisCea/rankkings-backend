openapi: 3.1.0
info:
  title: RankKings Catalog Service API
  version: 1.0.0
  description: >-
    Lectura del catálogo de obras. El gateway publica estas rutas bajo /api y
    las reenvía al catálogo. X-User-Id es un encabezado interno que solo debe
    inyectar el gateway tras validar la sesión.
servers:
  - url: http://localhost:8080/api
    description: API Gateway local
tags:
  - name: Items
paths:
  /items:
    get:
      tags: [Items]
      operationId: searchItems
      summary: Buscar obras por título o listar el catálogo
      description: >-
        Sin el parámetro query devuelve todas las obras ordenadas por título.
        La búsqueda no distingue mayúsculas de minúsculas.
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          description: Texto que debe aparecer en el título de la obra.
          schema:
            type: string
      responses:
        "200":
          description: Obras del catálogo que coinciden con la búsqueda.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankableItem"
        "500":
          $ref: "#/components/responses/ServerError"
  /items/{itemId}:
    get:
      tags: [Items]
      operationId: getItemById
      summary: Obtener una obra por identificador
      description: >-
        savedByCurrentUser refleja la sesión cuando está autenticada; para
        visitantes debe ser false.
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Obra encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankableItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /items/{itemId}/children:
    get:
      tags: [Items]
      operationId: getItemChildren
      summary: Listar los elementos hijos de una colección
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Obras hijas en orden de colección.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankableItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /internal/items:
    post:
      tags: [Items]
      operationId: createRankableItem
      summary: Crear una obra desde un servicio interno
      description: >-
        Asigna automáticamente el ID interno. Los identificadores externos,
        la portada y los enlaces son opcionales. details debe contener los
        datos requeridos para la categoría seleccionada.
      parameters:
        - $ref: "#/components/parameters/InternalKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRankableItemInput"
      responses:
        "201":
          description: Obra creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankableItem"
        "400":
          description: Datos de la obra inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Acceso interno denegado.
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: rk_token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Alternativa para herramientas no navegador, si está habilitada.
  parameters:
    InternalKey:
      name: X-Internal-Key
      in: header
      required: true
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    NotFound:
      description: Obra o colección no encontrada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServerError:
      description: Error inesperado del servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    CategoryId:
      type: string
      enum: [music, podcasts, books, movies, concerts, videogames, art, boardgames]
    VerificationStatus:
      type: string
      enum: [verified, partial, unverified]
    Creator:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
        linkedUserId:
          type: string
        linkedUsername:
          type: string
    ExternalLink:
      type: object
      additionalProperties: false
      required: [id, label, url, type]
      properties:
        id:
          type: string
        label:
          type: string
        url:
          type: string
          format: uri
        type:
          type: string
          enum: [streaming, store, social, other]
    CreateRankableItemInput:
      type: object
      additionalProperties: false
      required: [category, title, creator, uploadedBy, postId]
      properties:
        category:
          $ref: "#/components/schemas/CategoryId"
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        creator:
          $ref: "#/components/schemas/CreatorInput"
        uploadedBy:
          type: string
        year:
          type: integer
        coverUrl:
          type: string
          maxLength: 2048
          description: Opcional; puede omitirse y cargarse una portada como imagen del post.
        identifiers:
          type: object
          additionalProperties:
            type: string
          description: Identificadores externos opcionales, por ejemplo ISBN, ISRC o UPC.
        details:
          type: object
          additionalProperties:
            type: string
          description: >-
            Campos requeridos por categoría: music/podcasts/books/movies requieren format;
            concerts requiere eventDate, venue y city; videogames requiere platform;
            art requiere medium; boardgames requiere minPlayers, maxPlayers y playingTimeMinutes.
        externalLinks:
          type: array
          items:
            $ref: "#/components/schemas/NewExternalLink"
        postId:
          type: string
          description: ID de la publicación creada por el servicio social.
    CreatorInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          description: Opcional; si se omite, se genera un ID de creador.
        name:
          type: string
          minLength: 1
          maxLength: 200
        avatarUrl:
          type: string
          maxLength: 2048
        linkedUserId:
          type: string
        linkedUsername:
          type: string
    NewExternalLink:
      type: object
      additionalProperties: false
      required: [label, url, type]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          minLength: 1
          maxLength: 2048
        type:
          type: string
          minLength: 1
          maxLength: 20
    RankableItem:
      type: object
      additionalProperties: false
      required:
        - id
        - category
        - title
        - creator
        - uploadedBy
        - identifiers
        - details
        - verificationStatus
        - postId
        - averageRating
        - ratingsCount
        - childrenCount
        - savedByCurrentUser
        - savesCount
        - externalLinks
        - createdAt
      properties:
        id:
          type: string
        category:
          $ref: "#/components/schemas/CategoryId"
        title:
          type: string
        description:
          type: string
        creator:
          $ref: "#/components/schemas/Creator"
        uploadedBy:
          type: string
        year:
          type: integer
        coverUrl:
          type: string
          description: URL de portada; puede estar vacío si la portada se subió como imagen del post.
        identifiers:
          type: object
          additionalProperties:
            type: string
        details:
          type: object
          additionalProperties:
            type: string
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        postId:
          type: string
        averageRating:
          type: number
        ratingsCount:
          type: integer
          minimum: 0
        parentId:
          type: string
        position:
          type: integer
          minimum: 0
        childrenCount:
          type: integer
          minimum: 0
        childrenAverageRating:
          type: number
        savedByCurrentUser:
          type: boolean
        savesCount:
          type: integer
          minimum: 0
        externalLinks:
          type: array
          items:
            $ref: "#/components/schemas/ExternalLink"
        createdAt:
          type: string
          format: date-time
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
