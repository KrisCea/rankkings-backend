openapi: 3.1.0
info:
  title: RankKings Social Service API
  version: 1.0.0
  description: >-
    Lectura pública para visitantes sin sesión; las acciones de participación
    requieren autenticación. Los usuarios con role=user administran su contenido
    y los usuarios con role=admin pueden moderar contenido de cualquier autor.
    Feed, publicaciones, interacciones y comentarios. Las reseñas son comentarios
    del post de un Rankable Item, no publicaciones independientes. El gateway reenvía también
    /users/{username}/posts y /items/{itemId}/reviews a este servicio antes de
    las rutas comodín de identidad y catálogo. X-User-Id es interno y solo debe
    ser inyectado por el gateway.
servers:
  - url: http://localhost:8080/api
    description: API Gateway local
tags:
  - name: Posts
  - name: Comments
paths:
  /posts:
    get:
      tags: [Posts]
      operationId: getPosts
      summary: Obtener el feed de publicaciones
      description: >-
        Devuelve Post[]. La implementación actual del cliente no envía cursor,
        página ni límite; definir paginación y actualizar el cliente antes de
        activar scroll infinito.
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Publicaciones visibles para el feed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Posts]
      operationId: createPost
      summary: Crear un Rankable Item y su publicación, o publicar uno existente
      description: >-
        Para crear una obra nueva envía rankableItem y omite itemId. Para usar
        una obra existente envía itemId y omite rankableItem. coverUrl,
        identifiers y externalLinks son opcionales. Se puede cargar una portada
        después de crear el post mediante el endpoint de carga de imágenes.
        El post y la obra se publican inmediatamente; la obra comienza con
        verificationStatus=unverified hasta que se verifique. La verificación
        no bloquea la publicación ni la visibilidad del post.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPostInput"
      responses:
        "201":
          description: Publicación creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/featured:
    get:
      tags: [Posts]
      operationId: getFeaturedPosts
      summary: Obtener publicaciones destacadas
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Publicaciones destacadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}:
    get:
      tags: [Posts]
      operationId: getPostById
      summary: Obtener una publicación por identificador
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Publicación encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Posts]
      operationId: deletePost
      summary: Eliminar una publicación y su Rankable Item asociado
      description: Solo el autor de la publicación o un usuario con role=admin puede eliminarla. También se eliminan sus interacciones y adjuntos.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "204":
          description: Publicación y obra asociada eliminadas.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: El usuario no es autor ni administrador.
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/by-item/{itemId}:
    get:
      tags: [Posts]
      operationId: getPostForItem
      summary: Obtener la publicación asociada a un Rankable Item
      description: Permite resolver la publicación cuando el catálogo aún no tiene su postId sincronizado.
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Publicación asociada a la obra.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{username}/posts:
    get:
      tags: [Posts]
      operationId: getPostsByAuthor
      summary: Listar publicaciones por autor y tipo
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Username"
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PostKind"
      responses:
        "200":
          description: Posts del perfil; kind=review devuelve reseñas como comentarios asociados a su post.
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: "#/components/schemas/Post"
                    - $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /items/{itemId}/reviews:
    get:
      tags: [Posts]
      operationId: getReviewsForItem
      summary: Listar reseñas asociadas a una obra
      description: La respuesta son comentarios de reseña asociados al post del Rankable Item.
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Reseñas de la obra.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/reviews:
    post:
      tags: [Comments]
      operationId: addReview
      summary: Crear una reseña como comentario del post del Rankable Item
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReviewInput"
      responses:
        "201":
          description: Reseña creada como comentario del post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/reviews/{reviewId}:
    delete:
      tags: [Comments]
      operationId: deleteReview
      summary: Eliminar una reseña y retirar su puntuación
      description: La reseña queda marcada como eliminada; solo su autor o un usuario con role=admin puede eliminarla.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: Reseña eliminada y agregados de puntuación actualizados.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: El usuario no es autor de la reseña ni administrador.
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{postId}/media/uploads:
    post:
      tags: [Posts]
      operationId: createImageUploadUrl
      summary: Obtener una URL S3 firmada para subir una imagen al post
      description: >-
        Solo el autor del post puede subir hasta cuatro adjuntos (20 MB en total).
        Las imágenes admitidas son JPEG, PNG y WebP, hasta 10 MB cada una.
        La carga expira en cinco minutos. El cliente debe hacer         PUT con los encabezados indicados en la respuesta y confirmar después de subir el objeto.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUploadInput"
      responses:
        "201":
          description: URL de carga firmada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadUrl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: El usuario no es autor del post.
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Almacenamiento S3 no configurado.
  /posts/{postId}/media/{mediaId}/complete:
    post:
      tags: [Posts]
      operationId: confirmImageUpload
      summary: Confirmar y validar una imagen subida a S3
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Imagen confirmada; devuelve el Post actualizado, incluida la portada vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: El usuario no es autor del post.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La carga aún no está disponible o ya fue confirmada.
  /posts/{postId}/media/{mediaId}/content:
    get:
      tags: [Posts]
      operationId: getPostMediaContent
      summary: Redirigir a una URL firmada vigente para una imagen del post
      parameters:
        - $ref: "#/components/parameters/PostId"
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirige a la URL temporal de lectura de la imagen.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{postId}/media/external:
    post:
      tags: [Posts]
      operationId: addExternalMedia
      summary: Asociar un video o enlace HTTPS externo al post
      description: Los videos se admiten solo mediante enlace hasta contar con verificación de duración y moderación.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalMediaInput"
      responses:
        "201":
          description: Enlace externo asociado al post.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: El usuario no es autor del post.
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{postId}/media/{mediaId}:
    delete:
      tags: [Posts]
      operationId: deletePostMedia
      summary: Quitar un adjunto del post
      description: El autor del post o un usuario con role=admin puede quitar el adjunto.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Adjunto eliminado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: El usuario no es autor del post ni administrador.
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{postId}/vote:
    post:
      tags: [Posts]
      operationId: toggleVote
      summary: Alternar el voto de la sesión actual
      description: La operación es un toggle y no es idempotente.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Publicación con el estado de voto actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/rating:
    put:
      tags: [Posts]
      operationId: ratePost
      summary: Crear o reemplazar una nota
      description: Una nota por usuario y publicación; score entre 1.0 y 10.0.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [score]
              properties:
                score:
                  type: number
                  minimum: 1
                  maximum: 10
      responses:
        "200":
          description: Publicación con el promedio y nota actualizados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Posts]
      operationId: unratePost
      summary: Eliminar la nota de la sesión actual
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Publicación con promedios actualizados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/share:
    post:
      tags: [Posts]
      operationId: sharePost
      summary: Compartir una publicación con un usuario
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipientId]
              properties:
                recipientId:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Publicación compartida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/comments:
    get:
      tags: [Comments]
      operationId: getComments
      summary: Listar comentarios de una publicación
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Comentarios y respuestas (máximo un nivel de anidación).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Comments]
      operationId: addComment
      summary: Crear un comentario o respuesta
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCommentInput"
      responses:
        "201":
          description: Comentario creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /comments/{commentId}/like:
    post:
      tags: [Comments]
      operationId: toggleCommentLike
      summary: Alternar el like de un comentario
      description: La operación es un toggle y no es idempotente.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Comentario con el estado de like actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /comments/{commentId}:
    delete:
      tags: [Comments]
      operationId: deleteComment
      summary: Marcar un comentario como eliminado
      description: Solo el autor del comentario o un usuario con role=admin puede eliminarlo. El comentario se conserva como marcador para mantener las respuestas.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: Comentario marcado como eliminado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: El usuario no es autor del comentario ni administrador.
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/moderation:
    get:
      tags: [Moderation]
      operationId: getModerationQueue
      summary: Listar contenido pendiente de moderación
      description: Solo disponible para usuarios autenticados con role=admin. La cola incluye Rankable Items pendientes y registros antiguos que ya estaban pendientes.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ModerationStatus"
          default: pending
        - name: type
          in: query
          schema:
            type: string
            enum: [all, item, post, review, comment, media]
          default: all
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Página de contenido ordenada por fecha de envío descendente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationQueuePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Se requiere rol admin.
        "500":
          $ref: "#/components/responses/ServerError"
  /admin/moderation/{type}/{id}/approve:
    post:
      tags: [Moderation]
      operationId: approveModerationItem
      summary: Aprobar contenido pendiente
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModerationType"
        - $ref: "#/components/parameters/ModerationId"
      responses:
        "200":
          description: Decisión de moderación aplicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Se requiere rol admin.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: El contenido ya no está pendiente o el adjunto no está listo.
  /admin/moderation/{type}/{id}/reject:
    post:
      tags: [Moderation]
      operationId: rejectModerationItem
      summary: Rechazar contenido pendiente
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModerationType"
        - $ref: "#/components/parameters/ModerationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationRejectionInput"
      responses:
        "200":
          description: Decisión de moderación aplicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Se requiere rol admin.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: El contenido ya no está pendiente o el adjunto no está listo.
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: rk_token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Alternativa para herramientas no navegador, si está habilitada.
  parameters:
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 30
    ModerationType:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum: [post, review, comment, media]
    ModerationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Sesión ausente, inválida o expirada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Publicación, comentario, usuario u obra no encontrada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServerError:
      description: Error inesperado del servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    CategoryId:
      type: string
      enum: [music, podcasts, books, movies, concerts, videogames, art, boardgames]
    PostKind:
      type: string
      enum: [item, review]
    ModerationStatus:
      type: string
      enum: [approved, pending, rejected]
    ModerationAuthor:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
    ModerationContentType:
      type: string
      enum: [item, post, review, comment, media]
    ModerationQueueItem:
      oneOf:
        - $ref: "#/components/schemas/ModerationItem"
        - $ref: "#/components/schemas/ModerationPost"
        - $ref: "#/components/schemas/ModerationReview"
        - $ref: "#/components/schemas/ModerationComment"
        - $ref: "#/components/schemas/ModerationMedia"
      discriminator:
        propertyName: type
        mapping:
          item: "#/components/schemas/ModerationItem"
          post: "#/components/schemas/ModerationPost"
          review: "#/components/schemas/ModerationReview"
          comment: "#/components/schemas/ModerationComment"
          media: "#/components/schemas/ModerationMedia"
    ModerationEntry:
      type: object
      required: [id, type, status, submittedAt, author, content]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/ModerationContentType"
        status:
          $ref: "#/components/schemas/ModerationStatus"
        submittedAt:
          type: string
          format: date-time
        author:
          $ref: "#/components/schemas/ModerationAuthor"
        content:
          type: object
    ModerationItem:
      allOf:
        - $ref: "#/components/schemas/ModerationEntry"
        - type: object
          properties:
            type:
              const: item
            content:
              type: object
              required: [title, category, description, coverUrl, postId]
              properties:
                title:
                  type: string
                category:
                  type: string
                description:
                  type: string
                coverUrl:
                  type: [string, "null"]
                postId:
                  type: string
    ModerationPost:
      allOf:
        - $ref: "#/components/schemas/ModerationEntry"
        - type: object
          properties:
            type:
              const: post
            content:
              type: object
              required: [kind, caption, item]
              properties:
                kind:
                  const: item
                caption:
                  type: string
                item:
                  type: object
                  required: [id, title, category, coverUrl]
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    category:
                      type: string
                    coverUrl:
                      type: [string, "null"]
    ModerationReview:
      allOf:
        - $ref: "#/components/schemas/ModerationEntry"
        - type: object
          properties:
            type:
              const: review
            content:
              type: object
              required: [postId, itemId, text, authorScore]
              properties:
                postId:
                  type: string
                itemId:
                  type: string
                text:
                  type: string
                authorScore:
                  type: [number, "null"]
                  minimum: 1
                  maximum: 10
    ModerationComment:
      allOf:
        - $ref: "#/components/schemas/ModerationEntry"
        - type: object
          properties:
            type:
              const: comment
            content:
              type: object
              required: [postId, parentId, text]
              properties:
                postId:
                  type: string
                parentId:
                  type: [string, "null"]
                text:
                  type: string
    ModerationMedia:
      allOf:
        - $ref: "#/components/schemas/ModerationEntry"
        - type: object
          properties:
            type:
              const: media
            content:
              type: object
              required: [postId, mediaType, url, contentType, isCover]
              properties:
                postId:
                  type: string
                mediaType:
                  type: string
                  enum: [image, video, external]
                url:
                  type: string
                  format: uri
                contentType:
                  type: [string, "null"]
                isCover:
                  type: boolean
    ModerationQueuePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModerationQueueItem"
        page:
          type: object
          required: [limit, nextCursor, hasMore]
          properties:
            limit:
              type: integer
            nextCursor:
              type: [string, "null"]
            hasMore:
              type: boolean
    ModerationDecision:
      type: object
      required: [id, type, status, moderatedAt, moderatedBy, reason]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/ModerationContentType"
        status:
          type: string
          enum: [approved, rejected]
        moderatedAt:
          type: string
          format: date-time
        moderatedBy:
          $ref: "#/components/schemas/ModerationAuthor"
        reason:
          type: [string, "null"]
    ModerationRejectionInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, username, displayName, avatarUrl, accountType]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
        accountType:
          type: string
          enum: [individual, business]
        isVerified:
          type: boolean
    Creator:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
        linkedUserId:
          type: string
        linkedUsername:
          type: string
    ExternalLink:
      type: object
      additionalProperties: false
      required: [id, label, url, type]
      properties:
        id:
          type: string
        label:
          type: string
        url:
          type: string
          format: uri
        type:
          type: string
          enum: [streaming, store, social, other]
    RankableItem:
      type: object
      additionalProperties: false
      required:
        - id
        - category
        - title
        - creator
        - uploadedBy
        - identifiers
        - details
        - verificationStatus
        - postId
        - averageRating
        - ratingsCount
        - childrenCount
        - savedByCurrentUser
        - savesCount
        - externalLinks
        - createdAt
      properties:
        id:
          type: string
        category:
          $ref: "#/components/schemas/CategoryId"
        title:
          type: string
        description:
          type: string
        creator:
          $ref: "#/components/schemas/Creator"
        uploadedBy:
          type: string
        year:
          type: integer
        coverUrl:
          type: string
          description: URL de portada; puede estar vacío si la portada se subió como imagen del post.
        identifiers:
          type: object
          additionalProperties:
            type: string
        details:
          type: object
          additionalProperties:
            type: string
        verificationStatus:
          type: string
          enum: [verified, partial, unverified]
        postId:
          type: string
        averageRating:
          type: number
        ratingsCount:
          type: integer
          minimum: 0
        parentId:
          type: string
        position:
          type: integer
          minimum: 0
        childrenCount:
          type: integer
          minimum: 0
        childrenAverageRating:
          type: number
        savedByCurrentUser:
          type: boolean
        savesCount:
          type: integer
          minimum: 0
        externalLinks:
          type: array
          items:
            $ref: "#/components/schemas/ExternalLink"
        createdAt:
          type: string
          format: date-time
    PostMedia:
      type: object
      additionalProperties: false
      required: [id, url, type, isCover]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        type:
          type: string
          enum: [image, video, external]
        isCover:
          type: boolean
          description: Indica si la imagen se almacena como portada del Rankable Item.
        thumbnailUrl:
          type: string
          format: uri
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    PostReview:
      type: object
      additionalProperties: false
      required: [authorScore]
      properties:
        authorScore:
          type: [number, "null"]
          minimum: 1
          maximum: 10
          description: Null si esta publicación de reseña no tiene puntuación.
    Post:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - category
        - author
        - caption
        - media
        - rankableItem
        - votesCount
        - votedByCurrentUser
        - averageRating
        - ratingsCount
        - commentsCount
        - sharesCount
        - moderationStatus
        - createdAt
        - isReelEligible
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/PostKind"
        category:
          $ref: "#/components/schemas/CategoryId"
        author:
          $ref: "#/components/schemas/UserSummary"
        caption:
          type: string
        media:
          type: array
          items:
            $ref: "#/components/schemas/PostMedia"
        rankableItem:
          $ref: "#/components/schemas/RankableItem"
        review:
          $ref: "#/components/schemas/PostReview"
        votesCount:
          type: integer
          minimum: 0
        votedByCurrentUser:
          type: boolean
        averageRating:
          type: number
        ratingsCount:
          type: integer
          minimum: 0
        currentUserRating:
          type: number
          minimum: 1
          maximum: 10
        commentsCount:
          type: integer
          minimum: 0
        sharesCount:
          type: integer
          minimum: 0
        moderationStatus:
          $ref: "#/components/schemas/ModerationStatus"
        createdAt:
          type: string
          format: date-time
        isReelEligible:
          type: boolean
    CommentAuthor:
      type: object
      additionalProperties: false
      required: [id, username, avatarUrl]
      properties:
        id:
          type: string
        username:
          type: string
        avatarUrl:
          type: string
          format: uri
    Comment:
      type: object
      additionalProperties: false
      required: [id, postId, author, text, kind, isDeleted, likesCount, likedByCurrentUser, createdAt]
      properties:
        id:
          type: string
        postId:
          type: string
        parentId:
          type: string
        replyToUsername:
          type: string
        author:
          $ref: "#/components/schemas/CommentAuthor"
        text:
          type: string
        kind:
          type: string
          enum: [comment, review]
        isDeleted:
          type: boolean
          description: Indica si el texto fue eliminado; el marcador conserva el hilo de respuestas.
        authorScore:
          type: [number, "null"]
          minimum: 1
          maximum: 10
          description: En reseñas se incluye siempre; null cuando no se envió puntuación.
        moderationStatus:
          $ref: "#/components/schemas/ModerationStatus"
        likesCount:
          type: integer
          minimum: 0
        likedByCurrentUser:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NewPostInput:
      type: object
      additionalProperties: false
      required: [kind, caption]
      oneOf:
        - required: [itemId]
          not:
            required: [rankableItem]
        - required: [rankableItem]
          not:
            required: [itemId]
      properties:
        itemId:
          type: string
          minLength: 1
          description: Obra existente; no se envía junto con rankableItem.
        rankableItem:
          $ref: "#/components/schemas/NewRankableItemInput"
        kind:
          type: string
          enum: [item]
        caption:
          type: string
          maxLength: 2000
    NewRankableItemInput:
      type: object
      additionalProperties: false
      required: [category, title]
      oneOf:
        - required: [creator]
          not:
            required: [creatorName]
        - required: [creatorName]
          not:
            required: [creator]
      properties:
        category:
          type: string
          enum: [music, podcasts, books, movies, concerts, videogames, art, boardgames]
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        creator:
          $ref: "#/components/schemas/NewCreatorInput"
        creatorName:
          type: string
          minLength: 1
          maxLength: 200
          description: Forma abreviada del creador aceptada por el cliente web.
        year:
          type: integer
        coverUrl:
          type: string
          maxLength: 2048
          description: Opcional; una portada cargada a S3 se entrega mediante una URL firmada temporal.
        identifiers:
          type: object
          additionalProperties:
            type: string
          description: Identificadores externos opcionales, como ISBN, ISRC o UPC.
        details:
          type: object
          additionalProperties:
            type: string
          description: Datos específicos de la categoría, opcionales al crear desde /posts.
        externalLinks:
          type: array
          items:
            $ref: "#/components/schemas/NewExternalLinkInput"
    NewCreatorInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          description: Opcional; el catálogo genera uno si se omite.
        name:
          type: string
          minLength: 1
          maxLength: 200
        avatarUrl:
          type: string
          maxLength: 2048
        linkedUserId:
          type: string
        linkedUsername:
          type: string
    NewExternalLinkInput:
      type: object
      additionalProperties: false
      required: [label, url, type]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          minLength: 1
          maxLength: 2048
        type:
          type: string
          minLength: 1
          maxLength: 20
    NewReviewInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        authorScore:
          type: number
          minimum: 1
          maximum: 10
          description: Nota opcional del Rankable Item; se guarda como rating del autor.
    ImageUploadInput:
      type: object
      additionalProperties: false
      required: [contentType, sizeBytes]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        isCover:
          type: [boolean, "null"]
          default: false
          description: Si es true, reemplaza la portada; si se omite o es null, se trata como false.
    ImageUploadUrl:
      type: object
      additionalProperties: false
      required: [mediaId, uploadUrl, method, headers, expiresAt]
      properties:
        mediaId:
          type: string
        uploadUrl:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          additionalProperties:
            type: string
          example:
            Content-Type: image/jpeg
            If-None-Match: "*"
        expiresAt:
          type: string
          format: date-time
    ExternalMediaInput:
      type: object
      additionalProperties: false
      required: [url, type]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        type:
          type: string
          enum: [video, external]
    NewCommentInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        parentId:
          type: string
        replyToUsername:
          type: string
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
