openapi: 3.1.0
info:
  title: RankKings Social Service API
  version: 1.0.0
  description: >-
    Feed, publicaciones, interacciones y comentarios. Las reseñas son comentarios
    del post de un Rankable Item, no publicaciones independientes. El gateway reenvía también
    /users/{username}/posts y /items/{itemId}/reviews a este servicio antes de
    las rutas comodín de identidad y catálogo. X-User-Id es interno y solo debe
    ser inyectado por el gateway.
servers:
  - url: http://localhost:8080/api
    description: API Gateway local
tags:
  - name: Posts
  - name: Comments
paths:
  /posts:
    get:
      tags: [Posts]
      operationId: getPosts
      summary: Obtener el feed de publicaciones
      description: >-
        Devuelve Post[]. La implementación actual del cliente no envía cursor,
        página ni límite; definir paginación y actualizar el cliente antes de
        activar scroll infinito.
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Publicaciones visibles para el feed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Posts]
      operationId: createPost
      summary: Crear un Rankable Item y su publicación, o publicar uno existente
      description: >-
        Para crear una obra nueva envía rankableItem y omite itemId. Para usar
        una obra existente envía itemId y omite rankableItem. coverUrl,
        identifiers y externalLinks son opcionales. Se puede cargar una portada
        después de crear el post mediante el endpoint de carga de imágenes.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPostInput"
      responses:
        "201":
          description: Publicación creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/featured:
    get:
      tags: [Posts]
      operationId: getFeaturedPosts
      summary: Obtener publicaciones destacadas
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Publicaciones destacadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}:
    get:
      tags: [Posts]
      operationId: getPostById
      summary: Obtener una publicación por identificador
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Publicación encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/by-item/{itemId}:
    get:
      tags: [Posts]
      operationId: getPostForItem
      summary: Obtener la publicación asociada a un Rankable Item
      description: Permite resolver la publicación cuando el catálogo aún no tiene su postId sincronizado.
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Publicación asociada a la obra.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{username}/posts:
    get:
      tags: [Posts]
      operationId: getPostsByAuthor
      summary: Listar publicaciones por autor y tipo
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Username"
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PostKind"
      responses:
        "200":
          description: Posts del perfil; kind=review devuelve reseñas como comentarios asociados a su post.
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: "#/components/schemas/Post"
                    - $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /items/{itemId}/reviews:
    get:
      tags: [Posts]
      operationId: getReviewsForItem
      summary: Listar reseñas asociadas a una obra
      description: La respuesta son comentarios de reseña asociados al post del Rankable Item.
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Reseñas de la obra.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/reviews:
    post:
      tags: [Comments]
      operationId: addReview
      summary: Crear una reseña como comentario del post del Rankable Item
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReviewInput"
      responses:
        "201":
          description: Reseña creada como comentario del post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/media/uploads:
    post:
      tags: [Posts]
      operationId: createImageUploadUrl
      summary: Obtener una URL S3 firmada para subir una imagen al post
      description: >-
        Solo el autor del post puede subir hasta cuatro adjuntos (20 MB en total).
        Las imágenes admitidas son JPEG, PNG y WebP, hasta 10 MB cada una.
        La carga expira en cinco minutos. El cliente debe hacer         PUT con los encabezados indicados en la respuesta y confirmar después de subir el objeto.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUploadInput"
      responses:
        "201":
          description: URL de carga firmada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadUrl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: El usuario no es autor del post.
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Almacenamiento S3 no configurado.
  /posts/{postId}/media/{mediaId}/complete:
    post:
      tags: [Posts]
      operationId: confirmImageUpload
      summary: Confirmar y validar una imagen subida a S3
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Imagen confirmada y visible en el post.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: El usuario no es autor del post.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La carga aún no está disponible o ya fue confirmada.
  /posts/{postId}/media/external:
    post:
      tags: [Posts]
      operationId: addExternalMedia
      summary: Asociar un video o enlace HTTPS externo al post
      description: Los videos se admiten solo mediante enlace hasta contar con verificación de duración y moderación.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalMediaInput"
      responses:
        "201":
          description: Enlace externo asociado al post.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: El usuario no es autor del post.
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{postId}/media/{mediaId}:
    delete:
      tags: [Posts]
      operationId: deletePostMedia
      summary: Quitar un adjunto del post
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Adjunto eliminado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: El usuario no es autor del post.
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{postId}/vote:
    post:
      tags: [Posts]
      operationId: toggleVote
      summary: Alternar el voto de la sesión actual
      description: La operación es un toggle y no es idempotente.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Publicación con el estado de voto actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/rating:
    put:
      tags: [Posts]
      operationId: ratePost
      summary: Crear o reemplazar una nota
      description: Una nota por usuario y publicación; score entre 1.0 y 10.0.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [score]
              properties:
                score:
                  type: number
                  minimum: 1
                  maximum: 10
      responses:
        "200":
          description: Publicación con el promedio y nota actualizados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [Posts]
      operationId: unratePost
      summary: Eliminar la nota de la sesión actual
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Publicación con promedios actualizados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/share:
    post:
      tags: [Posts]
      operationId: sharePost
      summary: Compartir una publicación con un usuario
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipientId]
              properties:
                recipientId:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Publicación compartida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /posts/{postId}/comments:
    get:
      tags: [Comments]
      operationId: getComments
      summary: Listar comentarios de una publicación
      security:
        - {}
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Comentarios y respuestas (máximo un nivel de anidación).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Comments]
      operationId: addComment
      summary: Crear un comentario o respuesta
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCommentInput"
      responses:
        "201":
          description: Comentario creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /comments/{commentId}/like:
    post:
      tags: [Comments]
      operationId: toggleCommentLike
      summary: Alternar el like de un comentario
      description: La operación es un toggle y no es idempotente.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Comentario con el estado de like actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: rk_token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Alternativa para herramientas no navegador, si está habilitada.
  parameters:
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 30
  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Sesión ausente, inválida o expirada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Publicación, comentario, usuario u obra no encontrada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServerError:
      description: Error inesperado del servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    CategoryId:
      type: string
      enum: [music, podcasts, books, movies, concerts, videogames, art, boardgames]
    PostKind:
      type: string
      enum: [item, review]
    ModerationStatus:
      type: string
      enum: [approved, pending, rejected]
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, username, displayName, avatarUrl, accountType]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
        accountType:
          type: string
          enum: [individual, business]
        isVerifiedBusiness:
          type: boolean
    Creator:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
        linkedUserId:
          type: string
        linkedUsername:
          type: string
    ExternalLink:
      type: object
      additionalProperties: false
      required: [id, label, url, type]
      properties:
        id:
          type: string
        label:
          type: string
        url:
          type: string
          format: uri
        type:
          type: string
          enum: [streaming, store, social, other]
    RankableItem:
      type: object
      additionalProperties: false
      required:
        - id
        - category
        - title
        - creator
        - uploadedBy
        - identifiers
        - details
        - verificationStatus
        - postId
        - averageRating
        - ratingsCount
        - childrenCount
        - savedByCurrentUser
        - savesCount
        - externalLinks
        - createdAt
      properties:
        id:
          type: string
        category:
          $ref: "#/components/schemas/CategoryId"
        title:
          type: string
        description:
          type: string
        creator:
          $ref: "#/components/schemas/Creator"
        uploadedBy:
          type: string
        year:
          type: integer
        coverUrl:
          type: string
          description: URL de portada; puede estar vacío si la portada se subió como imagen del post.
        identifiers:
          type: object
          additionalProperties:
            type: string
        details:
          type: object
          additionalProperties:
            type: string
        verificationStatus:
          type: string
          enum: [verified, partial, unverified]
        postId:
          type: string
        averageRating:
          type: number
        ratingsCount:
          type: integer
          minimum: 0
        parentId:
          type: string
        position:
          type: integer
          minimum: 0
        childrenCount:
          type: integer
          minimum: 0
        childrenAverageRating:
          type: number
        savedByCurrentUser:
          type: boolean
        savesCount:
          type: integer
          minimum: 0
        externalLinks:
          type: array
          items:
            $ref: "#/components/schemas/ExternalLink"
        createdAt:
          type: string
          format: date-time
    PostMedia:
      type: object
      additionalProperties: false
      required: [id, url, type, isCover]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        type:
          type: string
          enum: [image, video, external]
        isCover:
          type: boolean
          description: Indica si la imagen se almacena como portada del Rankable Item.
        thumbnailUrl:
          type: string
          format: uri
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    PostReview:
      type: object
      additionalProperties: false
      required: [authorScore]
      properties:
        authorScore:
          type: number
          minimum: 1
          maximum: 10
    Post:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - category
        - author
        - caption
        - media
        - rankableItem
        - votesCount
        - votedByCurrentUser
        - averageRating
        - ratingsCount
        - commentsCount
        - sharesCount
        - moderationStatus
        - createdAt
        - isReelEligible
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/PostKind"
        category:
          $ref: "#/components/schemas/CategoryId"
        author:
          $ref: "#/components/schemas/UserSummary"
        caption:
          type: string
        media:
          type: array
          items:
            $ref: "#/components/schemas/PostMedia"
        rankableItem:
          $ref: "#/components/schemas/RankableItem"
        review:
          $ref: "#/components/schemas/PostReview"
        votesCount:
          type: integer
          minimum: 0
        votedByCurrentUser:
          type: boolean
        averageRating:
          type: number
        ratingsCount:
          type: integer
          minimum: 0
        currentUserRating:
          type: number
          minimum: 1
          maximum: 10
        commentsCount:
          type: integer
          minimum: 0
        sharesCount:
          type: integer
          minimum: 0
        moderationStatus:
          $ref: "#/components/schemas/ModerationStatus"
        createdAt:
          type: string
          format: date-time
        isReelEligible:
          type: boolean
    CommentAuthor:
      type: object
      additionalProperties: false
      required: [id, username, avatarUrl]
      properties:
        id:
          type: string
        username:
          type: string
        avatarUrl:
          type: string
          format: uri
    Comment:
      type: object
      additionalProperties: false
      required: [id, postId, author, text, kind, likesCount, likedByCurrentUser, createdAt]
      properties:
        id:
          type: string
        postId:
          type: string
        parentId:
          type: string
        replyToUsername:
          type: string
        author:
          $ref: "#/components/schemas/CommentAuthor"
        text:
          type: string
        kind:
          type: string
          enum: [comment, review]
        authorScore:
          type: number
          minimum: 1
          maximum: 10
        likesCount:
          type: integer
          minimum: 0
        likedByCurrentUser:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NewPostInput:
      type: object
      additionalProperties: false
      required: [kind, caption]
      oneOf:
        - required: [itemId]
          not:
            required: [rankableItem]
        - required: [rankableItem]
          not:
            required: [itemId]
      properties:
        itemId:
          type: string
          minLength: 1
          description: Obra existente; no se envía junto con rankableItem.
        rankableItem:
          $ref: "#/components/schemas/NewRankableItemInput"
        kind:
          type: string
          enum: [item]
        caption:
          type: string
          maxLength: 2000
    NewRankableItemInput:
      type: object
      additionalProperties: false
      required: [category, title, creator]
      properties:
        category:
          type: string
          enum: [music, podcasts, books, movies, concerts, videogames, art, boardgames]
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        creator:
          $ref: "#/components/schemas/NewCreatorInput"
        year:
          type: integer
        coverUrl:
          type: string
          maxLength: 2048
          description: Opcional. También se puede cargar una portada a S3 después de crear el post.
        identifiers:
          type: object
          additionalProperties:
            type: string
          description: Identificadores externos opcionales, como ISBN, ISRC o UPC.
        details:
          type: object
          additionalProperties:
            type: string
          description: >-
            Campos requeridos por categoría: music/podcasts/books/movies requieren format;
            concerts requiere eventDate, venue y city; videogames requiere platform;
            art requiere medium; boardgames requiere minPlayers, maxPlayers y playingTimeMinutes.
        externalLinks:
          type: array
          items:
            $ref: "#/components/schemas/NewExternalLinkInput"
    NewCreatorInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          description: Opcional; el catálogo genera uno si se omite.
        name:
          type: string
          minLength: 1
          maxLength: 200
        avatarUrl:
          type: string
          maxLength: 2048
