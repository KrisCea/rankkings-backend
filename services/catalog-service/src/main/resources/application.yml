server:
  address: ${SERVICE_BIND_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:h2:mem:catalog_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  flyway:
    enabled: false

rankkings:
  internal-key: ${INTERNAL_SERVICE_KEY:}
  seed-catalog: ${SEED_CATALOG:true}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${CATALOG_DB_URL:jdbc:h2:file:./data/catalog_db;MODE=PostgreSQL}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog_db}}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:${CATALOG_DB_USER:rankkings}}
    password: ${SPRING_DATASOURCE_PASSWORD:${CATALOG_DB_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
rankkings:
  seed-catalog: false
