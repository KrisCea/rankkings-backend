server:
  address: ${SERVICE_BIND_ADDRESS:127.0.0.1}
  port: 8082

spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:h2:mem:catalog_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

rankkings:
  internal-key: ${INTERNAL_SERVICE_KEY:}
  seed-catalog: ${SEED_CATALOG:true}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${CATALOG_DB_URL:jdbc:h2:file:./data/catalog_db;MODE=PostgreSQL}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catalog_db}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:rankkings}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
rankkings:
  seed-catalog: false
