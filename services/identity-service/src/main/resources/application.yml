server:
  address: ${SERVICE_BIND_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:h2:mem:identity_db;DB_CLOSE_DELAY=-1}
    username: ${IDENTITY_DB_USER:sa}
    password: ${IDENTITY_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update # desarrollo; usar migraciones en producción
    open-in-view: false
  flyway:
    enabled: false
rankkings:
  internal-key: ${INTERNAL_SERVICE_KEY:}
  jwt-secret: ${RANKINGS_JWT_SECRET:rankkings-local-development-secret-2026-32bytes}
  jwt-ttl-seconds: ${JWT_TTL_SECONDS:604800}
  cookie-secure: ${COOKIE_SECURE:false}
  turnstile-secret: ${TURNSTILE_SECRET:}
  dev-captcha-bypass: ${DEV_CAPTCHA_BYPASS:false}
  dev-verification-logging: ${DEV_VERIFICATION_LOGGING:false}
  social-url: ${SOCIAL_SERVICE_URL:http://localhost:8083}
  resend-api-key: ${RESEND_API_KEY:}
  email-from: ${VERIFICATION_FROM_EMAIL:}
  verify-url: ${VERIFICATION_URL:}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:h2:file:./data/identity_db}
rankkings:
  verify-url: ${VERIFICATION_URL:http://localhost:5173/verify-email}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:${IDENTITY_DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${IDENTITY_DB_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${IDENTITY_DB_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
rankkings:
  verify-url: ${VERIFICATION_URL:}
  jwt-secret: ${RANKINGS_JWT_SECRET:}
